name: Release

# Push a tag like `v0.1.0` (or `v0.1.0-rc.1` for a pre-release) to build the
# app and the CLI for Linux, macOS and Windows and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p ors-app -p ors-cli

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="obsirust-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$name"
          cp target/${{ matrix.target }}/release/obsirust-app target/${{ matrix.target }}/release/obsirust "$name/"
          cp assets/linux/obsirust.desktop "$name/"
          cp assets/logo/obsirust-icon-256.png "$name/obsirust.png"
          cp README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          name="obsirust-${GITHUB_REF_NAME}-${{ matrix.target }}"
          version="${GITHUB_REF_NAME#v}"
          app="$name/ObsiRust.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/${{ matrix.target }}/release/obsirust-app "$app/Contents/MacOS/"
          cp target/${{ matrix.target }}/release/obsirust "$name/"
          cp README.md "$name/"
          # App icon (.icns) from the 1024 px logo.
          iconset=ObsiRust.iconset
          mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/logo/obsirust-icon.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d assets/logo/obsirust-icon.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/ObsiRust.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>ObsiRust</string>
            <key>CFBundleDisplayName</key><string>ObsiRust</string>
            <key>CFBundleIdentifier</key><string>io.github.levibeux.obsirust</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleExecutable</key><string>obsirust-app</string>
            <key>CFBundleIconFile</key><string>ObsiRust</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Ad-hoc signature: required for Apple Silicon binaries to launch.
          codesign --force --deep --sign - "$app"
          codesign --force --sign - "$name/obsirust"
          ditto -c -k --keepParent "$name" "$name.zip"
          echo "ASSET=$name.zip" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "obsirust-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/obsirust-app.exe" $name
          Copy-Item "target/${{ matrix.target }}/release/obsirust.exe" $name
          Copy-Item "assets/logo/obsirust.ico" $name
          Copy-Item "README.md" $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Installation

            Téléchargez l'archive de votre système ci-dessous et décompressez-la.

            | Système | Fichier | Lancer |
            |---|---|---|
            | macOS (Apple Silicon : M1, M2, M3…) | `…-aarch64-apple-darwin.zip` | `ObsiRust.app` |
            | macOS (Intel) | `…-x86_64-apple-darwin.zip` | `ObsiRust.app` |
            | Windows | `…-x86_64-pc-windows-msvc.zip` | `obsirust-app.exe` |
            | Linux | `…-x86_64-unknown-linux-gnu.tar.gz` | `./obsirust-app` |

            Chaque archive contient aussi le CLI `obsirust` (`obsirust --help`).

            **Applications non signées.** Au premier lancement :
            - **macOS** : clic droit sur `ObsiRust.app` → *Ouvrir* → *Ouvrir*. Si macOS refuse encore : `xattr -dr com.apple.quarantine ObsiRust.app`.
            - **Windows** : SmartScreen → *Informations complémentaires* → *Exécuter quand même*.

            Les sommes SHA-256 sont dans `SHA256SUMS.txt`.
