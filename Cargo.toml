[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LeVibeux/ObsiRust"

[workspace.dependencies]
ors-core = { path = "crates/ors-core" }
ors-markdown = { path = "crates/ors-markdown" }
ors-vault = { path = "crates/ors-vault" }
ors-index = { path = "crates/ors-index" }
ors-graph = { path = "crates/ors-graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
