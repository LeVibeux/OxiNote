[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LeVibeux/OxiNote"

[workspace.dependencies]
oxi-core = { path = "crates/oxi-core" }
oxi-markdown = { path = "crates/oxi-markdown" }
oxi-vault = { path = "crates/oxi-vault" }
oxi-index = { path = "crates/oxi-index" }
oxi-graph = { path = "crates/oxi-graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
